name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Deliberate: if the code breaks on 8.4, we want to know whether it also
      # breaks on 7.2, not have the matrix cancelled after the first red leg.
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Check PHP syntax
        run: |
          find . -path ./.git -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run PHP smoke tests
        run: |
          for test_file in tests/php/*.php; do
            php "$test_file"
          done

  php-compat:
    name: PHP compatibility (7.2-8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      # 8.4 is only the runtime for the analyser. PHPCS works statically, so
      # the range actually targeted comes from testVersion in phpcs.xml.dist.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install analysis tools
        working-directory: .github
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP compatibility
        run: >
          .github/vendor/bin/phpcs -p -n
          --standard=.github/phpcs.xml.dist
          broadstreet.php Broadstreet/

  editor:
    name: Block editor build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Node.js and npm versions
        run: npm run check:engines

      - name: Lint editor sources and package metadata
        run: npm run lint

      - name: Check plugin release workflow contract
        run: ./tests/plugin-release-workflow.test.sh

      - name: Run editor extension smoke tests
        run: npm test

      - name: Build and verify installable plugin artifact
        env:
          BROADSTREET_ARTIFACT_ALLOW_DIRTY: 0
        run: npm run test:artifact -- "${RUNNER_TEMP}/broadstreet-artifact"

      - name: Upload installable plugin artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: broadstreet-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/broadstreet-artifact/*.zip
            ${{ runner.temp }}/broadstreet-artifact/*.sha256
            ${{ runner.temp }}/broadstreet-artifact/plugin-artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
